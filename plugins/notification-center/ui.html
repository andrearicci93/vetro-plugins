<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Notification Center</title>
<style>
:root { --bg: #0b0e14; --card: #161b26; --line: #262e3f; --txt: #eef2f9; --dim: #8b96ab; --acc: #2f7bff; --info: #2f7bff; --ok: #2fc28b; --warn: #f5a524; --alert: #f0506e; }
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; font: 15px/1.45 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--txt); }
.head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.logo { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, #2f7bff, #7b5cff); display: grid; place-items: center; font-size: 22px; }
h1 { font-size: 20px; margin: 0; flex: 1; font-weight: 600; }
.lang { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.lang button { border: 0; background: none; color: var(--dim); padding: 6px 12px; cursor: pointer; font: inherit; }
.lang button.on { background: var(--acc); color: #fff; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin: 0 0 12px; font-weight: 600; }
input, button { font: inherit; color: inherit; }
input[type=text], input[type=number] { width: 100%; background: #0f131c; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
input:focus { outline: 2px solid var(--acc); border-color: transparent; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row label { color: var(--dim); font-size: 13px; display: flex; align-items: center; gap: 6px; }
.row input[type=number] { width: 80px; margin: 0; }
.dur { display: flex; align-items: center; gap: 12px; width: 100%; color: var(--dim); font-size: 13px; }
.dur input { flex: 1; accent-color: var(--acc); margin: 0; }
.dur b { color: var(--txt); min-width: 44px; text-align: right; font-weight: 600; }
.wide { grid-column: 1 / -1; }
.levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.lv { border: 1px solid var(--line); background: #0f131c; border-radius: 14px; padding: 10px 4px; cursor: pointer; text-align: center; font-size: 12px; color: var(--dim); }
.lv i { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; margin: 0 auto 6px; }
.lv.on { color: #fff; border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
.modes { display: flex; gap: 8px; margin-bottom: 12px; }
.md { flex: 1; border: 1px solid var(--line); background: #0f131c; border-radius: 20px; padding: 8px 6px; cursor: pointer; color: var(--dim); font-size: 12px; }
.md.on { color: #fff; border-color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); }
.rs { margin: 0 0 0 auto; padding: 4px 12px; font-size: 12px; flex: none; }
.send { margin-left: auto; background: var(--acc); border: 0; border-radius: 22px; padding: 10px 26px; cursor: pointer; font-weight: 600; color: #fff; }
.send:active { transform: scale(.97); }
.msg { min-height: 20px; margin-top: 8px; font-size: 13px; color: var(--dim); } .ok { color: var(--ok); } .err { color: var(--alert); }
.prev { background: #0f131c; border-radius: 16px; padding: 14px; display: flex; gap: 12px; align-items: flex-start; border-left: 5px solid var(--c, var(--info)); }
.prev .ic { width: 40px; height: 40px; border-radius: 50%; background: var(--c, var(--info)); display: grid; place-items: center; flex: none; }
.prev b { display: block; } .prev span { color: var(--dim); font-size: 14px; word-break: break-word; }
ul { list-style: none; margin: 0; padding: 0; }
li { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
li:last-child { border: 0; }
li .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--c); }
li small { color: var(--dim); display: block; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 18px; padding: 6px 14px; cursor: pointer; color: var(--dim); margin-top: 10px; }
.empty { color: var(--dim); text-align: center; padding: 18px 0; }
pre { background: #0f131c; border-radius: 12px; padding: 10px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; margin: 0; color: #b9c4dc; }
</style>
</head>
<body>
<div class="head">
  <div class="logo">&#128276;</div>
  <h1 data-t="title">Notification Center</h1>
  <div class="lang"><button type="button" id="l-en">EN</button><button type="button" id="l-pt">PT</button></div>
</div>

<div class="grid">
  <div class="card">
    <h2 data-t="send">Send a notification</h2>
    <div class="levels" id="levels"></div>
    <div class="modes" id="modes"></div>
    <input type="text" id="title" maxlength="40" data-p="ph_title">
    <input type="text" id="message" maxlength="200" data-p="ph_msg">
    <div class="row">
      <div class="dur"><span data-t="secs">Show for (s)</span><input type="range" id="secs" min="1" max="60" value="8"><b id="secsv">8 s</b></div>
      <label><input type="checkbox" id="open" checked> <span data-t="open">Show on TV now</span></label>
      <button class="send" id="send" type="button" data-t="btn">Send</button>
    </div>
    <div class="msg" id="result"></div>
  </div>

  <div class="card">
    <h2 data-t="preview">Preview</h2>
    <div class="prev" id="prev"><div class="ic" id="pic"></div><div><b id="ptitle"></b><span id="pmsg"></span></div></div>
    <div class="msg" data-t="prevnote">The TV shows its own native banner; this is only an approximation.</div>
  </div>

  <div class="card">
    <h2 data-t="recent">Recently sent</h2>
    <ul id="recent"></ul>
    <button class="ghost" id="refresh" type="button" data-t="refresh">Refresh</button>
  </div>

  <div class="card wide">
    <h2 data-t="app">Companion app</h2>
    <div class="msg" style="margin:0 0 10px" data-t="appnote">Launches NotifCtr01.NotifCenter (fixed id). It must be installed on the TV, see the README.</div>
    <h2 data-t="curl">Send from another device</h2>
    <pre id="curl"></pre>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var T = {
    en: { title: "Notification Center", send: "Send a notification", secs: "Show for (s)", open: "Show on TV now", btn: "Send", preview: "Preview",
      prevnote: "The TV shows its own native banner; this is only an approximation.", recent: "Recently sent", refresh: "Refresh", app: "Companion app",
      appnote: "Launches NotifCtr01.NotifCenter (fixed id). It must be installed on the TV, see the README.", curl: "Send from another device",
      ph_title: "Title (optional)", ph_msg: "Message", sending: "Sending...", queued: "Sent to the TV", queuedq: "Queued (TV not launched)", none: "Nothing sent yet.", notitle: "Notification",
      info: "Info", ok: "Done", warn: "Warning", alert: "Alert", sample: "Your message appears here",
      mode: "Show as", m_both: "Both", m_banner: "Samsung banner", m_full: "Full screen", resend: "Resend", resent: "Sent again" },
    pt: { title: "Centro de Notifica\u00E7\u00F5es", send: "Enviar notifica\u00E7\u00E3o", secs: "Mostrar durante (s)", open: "Mostrar na TV agora", btn: "Enviar", preview: "Pr\u00E9-visualiza\u00E7\u00E3o",
      prevnote: "A TV mostra o seu pr\u00F3prio aviso nativo; isto \u00E9 s\u00F3 uma aproxima\u00E7\u00E3o.", recent: "Enviadas recentemente", refresh: "Atualizar", app: "App companheira",
      appnote: "Lan\u00E7a NotifCtr01.NotifCenter (id fixo). Tem de estar instalada na TV, ver o README.", curl: "Enviar a partir de outro dispositivo",
      ph_title: "T\u00EDtulo (opcional)", ph_msg: "Mensagem", sending: "A enviar...", queued: "Enviada para a TV", queuedq: "Em fila (TV n\u00E3o lan\u00E7ada)", none: "Ainda nada enviado.", notitle: "Notifica\u00E7\u00E3o",
      info: "Info", ok: "Conclu\u00EDdo", warn: "Aviso", alert: "Alerta", sample: "A sua mensagem aparece aqui",
      mode: "Mostrar como", m_both: "Ambos", m_banner: "Aviso Samsung", m_full: "Ecr\u00E3 inteiro", resend: "Reenviar", resent: "Enviada de novo" }
  };
  var LEVELS = ["info", "ok", "warn", "alert"];
  // One UI style line icons (24x24, round caps): info, done, warning, alert.
  var ICON_BODY = {
    info: '<circle cx="12" cy="12" r="9.5"/><path d="M12 11v6"/><circle cx="12" cy="7.6" r="0.6" fill="#fff"/>',
    ok: '<circle cx="12" cy="12" r="9.5"/><path d="M7.6 12.6l3 3 5.8-6.4"/>',
    warn: '<path d="M12 3.8L21.2 20H2.8z"/><path d="M12 10v4.6"/><circle cx="12" cy="17.4" r="0.6" fill="#fff"/>',
    alert: '<circle cx="12" cy="12" r="9.5"/><path d="M12 7v6"/><circle cx="12" cy="16.6" r="0.6" fill="#fff"/>'
  };
  function iconSvg(level, size) {
    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + (ICON_BODY[level] || ICON_BODY.info) + '</svg>';
  }
  var COLORS = { info: "#2f7bff", ok: "#2fc28b", warn: "#f5a524", alert: "#f0506e" };
  var lang = "en", level = "info", mode = "both", lastRecent = [];
  function tr(k) { return T[lang][k] || T.en[k] || k; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function say(text, cls) { $("result").textContent = text || ""; $("result").className = "msg " + (cls || ""); }
  function api(path, body) {
    var opt = body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {};
    return fetch(path, opt).then(function (r) { return r.json().then(function (j) { if (!r.ok) { throw new Error(j.error || "error " + r.status); } return j; }); });
  }
  function icon(l) { return iconSvg(l, 24); }
  function paintLevels() {
    $("levels").innerHTML = LEVELS.map(function (l) {
      return '<button type="button" class="lv' + (l === level ? " on" : "") + '" data-l="' + l + '" style="--c:' + COLORS[l] + '"><i style="background:' + COLORS[l] + '">' + iconSvg(l, 22) + "</i>" + esc(tr(l)) + "</button>";
    }).join("");
    var b = $("levels").getElementsByTagName("button"), i;
    for (i = 0; i < b.length; i++) { b[i].addEventListener("click", function () { level = this.getAttribute("data-l"); paintLevels(); preview(); }); }
  }
  function paintModes() {
    var MODES = ["both", "banner", "full"];
    $("modes").innerHTML = MODES.map(function (m) {
      return '<button type="button" class="md' + (m === mode ? " on" : "") + '" data-m="' + m + '">' + esc(tr("m_" + m)) + "</button>";
    }).join("");
    var b = $("modes").getElementsByTagName("button"), i;
    for (i = 0; i < b.length; i++) { b[i].addEventListener("click", function () { mode = this.getAttribute("data-m"); paintModes(); }); }
  }
  function preview() {
    $("prev").style.setProperty("--c", COLORS[level]);
    $("pic").innerHTML = icon(level);
    $("ptitle").textContent = $("title").value || tr("notitle");
    $("pmsg").textContent = $("message").value || tr("sample");
  }
  function recent() {
    api("recent").then(function (d) {
      lastRecent = d.recent;
      $("recent").innerHTML = d.recent.length ? d.recent.map(function (n, i) {
        return '<li style="--c:' + (COLORS[n.level] || COLORS.info) + '"><span class="dot"></span><div><b>' + esc(n.title || tr("notitle")) + "</b> " + esc(n.message) +
          "<small>" + new Date(n.at).toLocaleTimeString() + "</small></div>" +
          '<button type="button" class="ghost rs" data-i="' + i + '">' + esc(tr("resend")) + "</button></li>";
      }).join("") : '<li class="empty">' + esc(tr("none")) + "</li>";
      var rb = $("recent").getElementsByClassName("rs"), k;
      for (k = 0; k < rb.length; k++) {
        rb[k].addEventListener("click", function () {
          var n = lastRecent[parseInt(this.getAttribute("data-i"), 10)];
          if (!n) { return; }
          api("notify", { title: n.title, message: n.message, level: n.level, mode: n.mode, duration: parseInt($("secs").value, 10) || 8, open: $("open").checked })
            .then(function () { say(tr("resent"), "ok"); recent(); })
            .catch(function (e) { say(e.message, "err"); });
        });
      }
    }).catch(function (e) { say(e.message, "err"); });
  }
  function applyLang() {
    document.documentElement.lang = lang;
    var els = document.querySelectorAll("[data-t]"), i;
    for (i = 0; i < els.length; i++) { els[i].textContent = tr(els[i].getAttribute("data-t")); }
    els = document.querySelectorAll("[data-p]");
    for (i = 0; i < els.length; i++) { els[i].placeholder = tr(els[i].getAttribute("data-p")); }
    $("l-en").className = lang === "en" ? "on" : ""; $("l-pt").className = lang === "pt" ? "on" : "";
    paintLevels(); paintModes(); preview(); recent();
  }
  // The language is a Shard setting (default English); it also decides the language of the app screen on the TV.
  function setLang(l) { lang = l; applyLang(); api("lang", { lang: l }).catch(function (e) { say(e.message, "err"); }); }
  // The dashboard frame has no allow-forms: use buttons and the Enter key, not <form>.
  $("send").addEventListener("click", function () {
    say(tr("sending"));
    api("notify", { title: $("title").value, message: $("message").value, level: level, mode: mode, duration: parseInt($("secs").value, 10) || 8, open: $("open").checked })
      .then(function (r) { say(r.open === "not requested" ? tr("queuedq") : tr("queued"), "ok"); $("message").value = ""; preview(); recent(); })
      .catch(function (e) { say(e.message, "err"); });
  });
  $("message").addEventListener("keydown", function (e) { if (e.key === "Enter") { $("send").click(); } });
  $("message").addEventListener("input", preview); $("title").addEventListener("input", preview);
  $("secs").addEventListener("input", function () { $("secsv").textContent = this.value + " s"; });
  $("refresh").addEventListener("click", recent);
  $("l-en").addEventListener("click", function () { setLang("en"); });
  $("l-pt").addEventListener("click", function () { setLang("pt"); });
  $("curl").textContent = 'curl -X POST http://<TV-IP>:8099/plugins/notification-center/api/notify \\\n  -H "Content-Type: application/json" \\\n  -d \'{"title":"Oven","message":"Dinner is ready","level":"ok","seconds":30}\'';
  applyLang();
  api("lang").then(function (d) { if (T[d.lang] && d.lang !== lang) { lang = d.lang; applyLang(); } }).catch(function () { /* keep English */ });
})();
</script>
</body>
</html>
