<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Notification Center</title>
<style>
:root { --bg: #0b0e14; --card: #161b26; --line: #262e3f; --txt: #eef2f9; --dim: #8b96ab; --acc: #2f7bff; --info: #2f7bff; --ok: #2fc28b; --warn: #f5a524; --alert: #f0506e; }
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; font: 15px/1.45 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--txt); }
.head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.logo { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, #2f7bff, #7b5cff); display: grid; place-items: center; font-size: 22px; }
h1 { font-size: 20px; margin: 0; flex: 1; font-weight: 600; }
.lang { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.lang button { border: 0; background: none; color: var(--dim); padding: 6px 12px; cursor: pointer; font: inherit; }
.lang button.on { background: var(--acc); color: #fff; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin: 0 0 12px; font-weight: 600; }
input, button { font: inherit; color: inherit; }
input[type=text], input[type=number] { width: 100%; background: #0f131c; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
input:focus { outline: 2px solid var(--acc); border-color: transparent; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row label { color: var(--dim); font-size: 13px; display: flex; align-items: center; gap: 6px; }
.row input[type=number] { width: 80px; margin: 0; }
.dur { display: flex; align-items: center; gap: 12px; width: 100%; color: var(--dim); font-size: 13px; }
.dur input { flex: 1; accent-color: var(--acc); margin: 0; }
.dur b { color: var(--txt); min-width: 44px; text-align: right; font-weight: 600; }
.picker { background: #0f131c; border: 1px solid var(--line); border-radius: 14px; padding: 10px; margin-bottom: 10px; }
.picker[hidden] { display: none; }
.ecats { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.ecats button { border: 1px solid var(--line); background: none; color: var(--dim); border-radius: 14px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
.ecats button.on { color: #fff; border-color: var(--acc); }
.egrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 4px; max-height: 210px; overflow-y: auto; margin-top: 8px; }
.egrid button { font-size: 22px; background: none; border: 0; border-radius: 8px; cursor: pointer; padding: 4px; }
.egrid button:hover { background: #232a38; }
.wide { grid-column: 1 / -1; }
.levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.lv { border: 1px solid var(--line); background: #0f131c; border-radius: 14px; padding: 10px 4px; cursor: pointer; text-align: center; font-size: 12px; color: var(--dim); }
.lv i { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; margin: 0 auto 6px; }
.lv.on { color: #fff; border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
.modes { display: flex; gap: 8px; margin-bottom: 12px; }
.md { flex: 1; border: 1px solid var(--line); background: #0f131c; border-radius: 20px; padding: 8px 6px; cursor: pointer; color: var(--dim); font-size: 12px; }
.md.on { color: #fff; border-color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); }
.rs { margin: 0 0 0 auto; padding: 4px 12px; font-size: 12px; flex: none; }
.send { margin-left: auto; background: var(--acc); border: 0; border-radius: 22px; padding: 10px 26px; cursor: pointer; font-weight: 600; color: #fff; }
button { transition: transform .08s, background .2s, opacity .2s; }
button:active { transform: scale(.94); }
button.busy { opacity: .65; pointer-events: none; }
button.busy::after { content: ""; display: inline-block; width: 10px; height: 10px; margin-left: 8px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -1px; }
button.done { background: var(--ok) !important; border-color: var(--ok) !important; color: #fff !important; }
button.fail { background: var(--alert) !important; border-color: var(--alert) !important; color: #fff !important; }
@keyframes sp { to { transform: rotate(360deg); } }
.msg { min-height: 20px; margin-top: 8px; font-size: 13px; color: var(--dim); } .ok { color: var(--ok); } .err { color: var(--alert); }
.scene { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; border: 1px solid var(--line); border-radius: 16px; background: #0a1120; }
@keyframes ncSlide { 0% { opacity: 0; transform: translateX(90px); } 14%, 84% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; transform: translateX(90px); } }
@keyframes ncFade { 0%, 4% { opacity: 0; } 14%, 84% { opacity: 1; } 96%, 100% { opacity: 0; } }
.sc-banner { animation: ncSlide 6s ease-in-out infinite; }
.sc-card { animation: ncFade 6s ease-in-out infinite; }
.prev { background: #0f131c; border-radius: 16px; padding: 14px; display: flex; gap: 12px; align-items: flex-start; border-left: 5px solid var(--c, var(--info)); }
.prev .ic { width: 40px; height: 40px; border-radius: 50%; background: var(--c, var(--info)); display: grid; place-items: center; flex: none; }
.prev b { display: block; } .prev span { color: var(--dim); font-size: 14px; word-break: break-word; }
ul { list-style: none; margin: 0; padding: 0; }
li { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
li:last-child { border: 0; }
li .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--c); }
li small { color: var(--dim); display: block; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 18px; padding: 6px 14px; cursor: pointer; color: var(--dim); margin-top: 10px; }
.empty { color: var(--dim); text-align: center; padding: 18px 0; }
pre { background: #0f131c; border-radius: 12px; padding: 10px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; margin: 0; color: #b9c4dc; }
</style>
</head>
<body>
<div class="head">
  <div class="logo">&#128276;</div>
  <h1 data-t="title">Notification Center</h1>
  <div class="lang"><button type="button" id="l-en">EN</button><button type="button" id="l-pt">PT</button></div>
</div>

<div class="grid">
  <div class="card">
    <h2 data-t="send">Send a notification</h2>
    <div class="levels" id="levels"></div>
    <div class="modes" id="modes"></div>
    <input type="text" id="title" maxlength="40" data-p="ph_title">
    <input type="text" id="message" maxlength="200" data-p="ph_msg">
    <input type="text" id="image" maxlength="290" data-p="ph_image">
    <input type="text" id="wallpaper" maxlength="290" data-p="ph_wall">
    <div class="row" style="margin-bottom:10px"><input type="text" id="icon" maxlength="8" data-p="ph_icon" style="flex:1;min-width:150px;margin:0"><button type="button" class="ghost" id="pick" style="margin:0" data-t="pick">Choose icon</button><button type="button" class="ghost" id="noicon" style="margin:0" data-t="noicon">Level icon</button></div>
    <div class="picker" id="picker" hidden><input type="text" id="esearch" data-p="ph_search" style="margin-bottom:0"><div class="ecats" id="ecats"></div><div class="egrid" id="egrid"></div><div class="msg" id="esrc"></div></div>
    <div class="row">
      <div class="dur"><span data-t="secs">Show for (s)</span><input type="range" id="secs" min="1" max="60" value="8"><b id="secsv">8 s</b></div>
      <label><input type="checkbox" id="open" checked> <span data-t="open">Show on TV now</span></label>
      <button class="send" id="send" type="button" data-t="btn">Send</button>
    </div>
    <div class="msg" id="result"></div>
  </div>

  <div class="card">
    <h2 data-t="preview">Preview</h2>
    <svg id="scene" class="scene" viewBox="0 0 1920 1080" role="img" font-family="SamsungOneUI, system-ui, Segoe UI, sans-serif" font-weight="500">
      <defs>
        <linearGradient id="tvSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101c3f"/><stop offset=".45" stop-color="#553b73"/><stop offset=".72" stop-color="#d9707a"/><stop offset="1" stop-color="#f6b26b"/></linearGradient>
        <radialGradient id="tvSun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff2cf" stop-opacity=".95"/><stop offset=".35" stop-color="#ffc58a" stop-opacity=".5"/><stop offset="1" stop-color="#ffc58a" stop-opacity="0"/></radialGradient>
        <linearGradient id="tvWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0a26c"/><stop offset="1" stop-color="#1a2547"/></linearGradient>
      </defs>
      <rect width="1920" height="1080" fill="url(#tvSky)"/><circle cx="1330" cy="640" r="420" fill="url(#tvSun)"/><circle cx="1330" cy="640" r="64" fill="#fff0c9"/>
      <path d="M0 690 220 520 420 640 640 470 880 650 1080 560 1290 690 1500 540 1740 660 1920 590V760H0z" fill="#42375f"/>
      <path d="M0 760 180 640 400 740 640 620 900 760 1160 650 1420 770 1680 670 1920 740V800H0z" fill="#26274a"/>
      <rect y="780" width="1920" height="300" fill="url(#tvWater)"/>
      <rect x="1250" y="790" width="160" height="6" rx="3" fill="#ffe3b3" opacity=".7"/><rect x="1280" y="820" width="100" height="5" rx="2" fill="#ffe3b3" opacity=".45"/><rect x="1300" y="850" width="60" height="4" rx="2" fill="#ffe3b3" opacity=".3"/>
      <path d="M0 900 0 1080H1920V920C1700 880 1500 930 1250 900 900 860 600 930 0 900z" fill="#0d1530" opacity=".55"/>
      <g id="dyn"></g>
    </svg>
    <div class="msg" data-t="prevnote">The TV shows its own native banner; this is only an approximation.</div>
  </div>

  <div class="card">
    <h2 data-t="recent">Recently sent</h2>
    <ul id="recent"></ul>
    <button class="ghost" id="refresh" type="button" data-t="refresh">Refresh</button>
  </div>

  <div class="card wide">
    <h2 data-t="app">Companion app</h2>
    <div class="msg" style="margin:0 0 10px" data-t="appnote">Launches NotifCtr01.NotifCenter (fixed id). It must be installed on the TV, see the README.</div>
    <h2 data-t="curl">Send from another device</h2>
    <pre id="curl"></pre>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var T = {
    en: { title: "Notification Center", send: "Send a notification", secs: "Show for (s)", open: "Show on TV now", btn: "Send", preview: "Preview",
      prevnote: "The TV shows its own native banner; this is only an approximation.", recent: "Recently sent", refresh: "Refresh", app: "Companion app",
      appnote: "Launches NotifCtr01.NotifCenter (fixed id). It must be installed on the TV, see the README.", curl: "Send from another device",
      ph_title: "Title (optional)", ph_msg: "Message", ph_wall: "Wallpaper URL, full-screen background (optional)", ph_image: "Image URL for the full-screen card (optional)", ph_icon: "Icon (emoji, optional; default by level)", pick: "Choose icon", noicon: "Level icon", ph_search: "Search icons...", groups: "Smileys,People,Animals,Food,Travel,Activities,Objects,Symbols,Flags", sending: "Sending...", queued: "Sent to the TV", queuedq: "Queued (TV not launched)", none: "Nothing sent yet.", notitle: "Notification",
      info: "Info", ok: "Done", warn: "Warning", alert: "Alert", sample: "Your message appears here", back: "Returning to the previous app in",
      mode: "Show as", m_both: "Both", m_banner: "Samsung banner", m_full: "Full screen", resend: "Resend", resent: "Sent again" },
    pt: { title: "Centro de Notifica\u00E7\u00F5es", send: "Enviar notifica\u00E7\u00E3o", secs: "Mostrar durante (s)", open: "Mostrar na TV agora", btn: "Enviar", preview: "Pr\u00E9-visualiza\u00E7\u00E3o",
      prevnote: "A TV mostra o seu pr\u00F3prio aviso nativo; isto \u00E9 s\u00F3 uma aproxima\u00E7\u00E3o.", recent: "Enviadas recentemente", refresh: "Atualizar", app: "App companheira",
      appnote: "Lan\u00E7a NotifCtr01.NotifCenter (id fixo). Tem de estar instalada na TV, ver o README.", curl: "Enviar a partir de outro dispositivo",
      ph_title: "T\u00EDtulo (opcional)", ph_msg: "Mensagem", ph_wall: "URL do wallpaper de fundo em ecr\u00E3 inteiro (opcional)", ph_image: "URL da imagem para o cart\u00E3o de ecr\u00E3 inteiro (opcional)", ph_icon: "\u00CDcone (emoji, opcional; por defeito pelo n\u00EDvel)", pick: "Escolher \u00EDcone", noicon: "\u00CDcone do n\u00EDvel", ph_search: "Pesquisar \u00EDcones...", groups: "Smileys,Pessoas,Animais,Comida,Viagens,Atividades,Objetos,S\u00EDmbolos,Bandeiras", sending: "A enviar...", queued: "Enviada para a TV", queuedq: "Em fila (TV n\u00E3o lan\u00E7ada)", none: "Ainda nada enviado.", notitle: "Notifica\u00E7\u00E3o",
      info: "Info", ok: "Conclu\u00EDdo", warn: "Aviso", alert: "Alerta", sample: "A sua mensagem aparece aqui", back: "A voltar \u00E0 aplica\u00E7\u00E3o anterior em",
      mode: "Mostrar como", m_both: "Ambos", m_banner: "Aviso Samsung", m_full: "Ecr\u00E3 inteiro", resend: "Reenviar", resent: "Enviada de novo" }
  };
  var LEVELS = ["info", "ok", "warn", "alert"];
  // One UI style line icons (24x24, round caps): info, done, warning, alert.
  var ICON_BODY = {
    info: '<circle cx="12" cy="12" r="9.5"/><path d="M12 11v6"/><circle cx="12" cy="7.6" r="0.6" fill="#fff"/>',
    ok: '<circle cx="12" cy="12" r="9.5"/><path d="M7.6 12.6l3 3 5.8-6.4"/>',
    warn: '<path d="M12 3.8L21.2 20H2.8z"/><path d="M12 10v4.6"/><circle cx="12" cy="17.4" r="0.6" fill="#fff"/>',
    alert: '<circle cx="12" cy="12" r="9.5"/><path d="M12 7v6"/><circle cx="12" cy="16.6" r="0.6" fill="#fff"/>'
  };
  function iconSvg(level, size) {
    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + (ICON_BODY[level] || ICON_BODY.info) + '</svg>';
  }
  var LEVEL_EMOJI = { info: "\u2139\uFE0F", ok: "\u2705", warn: "\u26A0\uFE0F", alert: "\uD83D\uDD34" };
  var COLORS = { info: "#2f7bff", ok: "#2fc28b", warn: "#f5a524", alert: "#f0506e" };
  var lang = "en", level = "info", mode = "banner", lastRecent = [];
  function tr(k) { return T[lang][k] || T.en[k] || k; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function say(text, cls) { $("result").textContent = text || ""; $("result").className = "msg " + (cls || ""); }
  function api(path, body) {
    var opt = body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {};
    return fetch(path, opt).then(function (r) { return r.json().then(function (j) { if (!r.ok) { throw new Error(j.error || "error " + r.status); } return j; }); });
  }
  function icon(l) { return iconSvg(l, 24); }
  function paintLevels() {
    $("levels").innerHTML = LEVELS.map(function (l) {
      return '<button type="button" class="lv' + (l === level ? " on" : "") + '" data-l="' + l + '" style="--c:' + COLORS[l] + '"><i style="background:' + COLORS[l] + '">' + iconSvg(l, 22) + "</i>" + esc(tr(l)) + "</button>";
    }).join("");
    var b = $("levels").getElementsByTagName("button"), i;
    for (i = 0; i < b.length; i++) { b[i].addEventListener("click", function () { level = this.getAttribute("data-l"); paintLevels(); preview(); }); }
  }
  function paintModes() {
    var MODES = ["banner", "full", "both"];
    $("modes").innerHTML = MODES.map(function (m) {
      return '<button type="button" class="md' + (m === mode ? " on" : "") + '" data-m="' + m + '">' + esc(tr("m_" + m)) + "</button>";
    }).join("");
    var b = $("modes").getElementsByTagName("button"), i;
    for (i = 0; i < b.length; i++) { b[i].addEventListener("click", function () { mode = this.getAttribute("data-m"); paintModes(); preview(); }); }
  }
  function cut(t, n) { t = String(t || ""); return t.length > n ? t.slice(0, n - 1) + "\u2026" : t; }
  function iconAt(l, x, y, size) {
    return '<svg x="' + x + '" y="' + y + '" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + (ICON_BODY[l] || ICON_BODY.info) + "</svg>";
  }
  function glyph(cx, cy, size) {
    var e = $("icon").value;
    if (e) { return '<text x="' + cx + '" y="' + (cy + Math.round(size * 0.35)) + '" text-anchor="middle" font-size="' + size + '">' + esc(e) + "</text>"; }
    return iconAt(level, cx - size / 2, cy - size / 2, size);
  }
  // Preview drawn like the Vetro UI overview: the same sunset scene as the TV, with the notification on top.
  function preview() {
    var c = COLORS[level], ttl = $("title").value || tr("notitle"), msg = $("message").value || tr("sample");
    var dur = parseInt($("secs").value, 10) || 8, h = "";
    var bhead = $("icon").value || LEVEL_EMOJI[level];
    if (mode !== "banner") {
      h += '<g class="sc-card"><rect width="1920" height="1080" fill="#07090f" fill-opacity=".55"/>' +
        '<rect x="360" y="330" width="1200" height="310" rx="64" fill="#fff" fill-opacity=".1"/><rect x="360" y="330" width="18" height="310" rx="9" fill="' + c + '"/>' +
        '<circle cx="520" cy="485" r="74" fill="' + c + '"/>' + glyph(520, 485, 88) +
        '<text x="640" y="470" font-size="54" font-weight="600" fill="#fff">' + esc(cut(ttl, 30)) + '</text>' +
        '<text x="640" y="540" font-size="38" fill="#c4cde0">' + esc(cut(msg, 52)) + "</text>" +
        '<text x="960" y="745" text-anchor="middle" font-size="36" fill="#8b96ab">' + esc(tr("back")) + '</text>' +
        '<text x="960" y="900" text-anchor="middle" font-size="160" font-weight="700" fill="#fff">' + dur + "</text></g>";
    }
    if (mode !== "full") {
      h += '<g class="sc-banner"><rect x="1236" y="60" width="628" height="196" rx="44" fill="#fff" fill-opacity=".22"/><rect x="1238" y="62" width="624" height="192" rx="42" fill="#243448" fill-opacity=".94"/>' +
        '<rect x="1268" y="96" width="88" height="88" rx="24" fill="#4a6cf7"/><text x="1312" y="154" text-anchor="middle" font-size="52">\uD83D\uDD14</text>' +
        '<text x="1380" y="132" font-size="32" font-weight="600" fill="#fff">' + esc(cut(bhead + " " + ttl, 24)) + "</text>" +
        '<text x="1380" y="172" font-size="26" fill="#fff" fill-opacity=".75">' + esc(cut(msg, 30)) + "</text>" +
        '<text x="1380" y="226" font-size="24" font-weight="600" fill="#8fbaff">OK</text><text x="1470" y="226" font-size="24" fill="#8fbaff">View history</text></g>';
    }
    $("dyn").innerHTML = h;
  }

  // Visible feedback on action buttons: spinner while it runs (at least 0.45 s), then green (done) or red (failed) for a moment.
  function act(btn, p) {
    var t0 = Date.now();
    btn.classList.add("busy");
    function end(cls) {
      setTimeout(function () {
        btn.classList.remove("busy"); btn.classList.add(cls);
        setTimeout(function () { btn.classList.remove(cls); }, 1300);
      }, Math.max(0, 450 - (Date.now() - t0)));
    }
    p.then(function () { end("done"); }, function () { end("fail"); });
  }
  function recent() {
    return api("recent").then(function (d) {
      lastRecent = d.recent;
      $("recent").innerHTML = d.recent.length ? d.recent.map(function (n, i) {
        return '<li style="--c:' + (COLORS[n.level] || COLORS.info) + '"><span class="dot"></span><div><b>' + esc(n.title || tr("notitle")) + "</b> " + esc(n.message) +
          "<small>" + new Date(n.at).toLocaleTimeString() + "</small></div>" +
          '<button type="button" class="ghost rs" data-i="' + i + '">' + esc(tr("resend")) + "</button></li>";
      }).join("") : '<li class="empty">' + esc(tr("none")) + "</li>";
      var rb = $("recent").getElementsByClassName("rs"), k;
      for (k = 0; k < rb.length; k++) {
        rb[k].addEventListener("click", function () {
          var n = lastRecent[parseInt(this.getAttribute("data-i"), 10)];
          if (!n) { return; }
          act(this, api("notify", { title: n.title, message: n.message, level: n.level, icon: n.icon, image: n.image, wallpaper: n.wallpaper, mode: n.mode, duration: parseInt($("secs").value, 10) || 8, open: $("open").checked })
            .then(function () { say(tr("resent"), "ok"); recent(); })
            .catch(function (e) { say(e.message, "err"); throw e; }));
        });
      }
    }).catch(function (e) { say(e.message, "err"); throw e; });
  }
  function applyLang() {
    document.documentElement.lang = lang;
    var els = document.querySelectorAll("[data-t]"), i;
    for (i = 0; i < els.length; i++) { els[i].textContent = tr(els[i].getAttribute("data-t")); }
    els = document.querySelectorAll("[data-p]");
    for (i = 0; i < els.length; i++) { els[i].placeholder = tr(els[i].getAttribute("data-p")); }
    $("l-en").className = lang === "en" ? "on" : ""; $("l-pt").className = lang === "pt" ? "on" : "";
    paintLevels(); paintModes(); preview(); recent().catch(function () {});
  }
  // Icon picker: emoji list from the Unicode CLDR data (bundled with the Shard, no network), with search in English and Portuguese.
  var EMOJI = null, ecat = 0;
  function eRender() {
    if (!EMOJI) { return; }
    var q = $("esearch").value.toLowerCase().trim(), names = tr("groups").split(","), i, out = [];
    $("ecats").innerHTML = names.map(function (n, k) { return '<button type="button" data-g="' + k + '"' + (k === ecat && !q ? ' class="on"' : "") + ">" + esc(n) + "</button>"; }).join("");
    for (i = 0; i < EMOJI.list.length && out.length < 400; i++) {
      var e = EMOJI.list[i];
      if (q ? (e[2] + " " + e[3] + " " + e[4]).toLowerCase().indexOf(q) >= 0 : e[1] === ecat) { out.push(e); }
    }
    $("egrid").innerHTML = out.map(function (e) { return '<button type="button" data-c="' + esc(e[0]) + '" title="' + esc(lang === "pt" ? e[3] : e[2]) + '">' + e[0] + "</button>"; }).join("");
    var cb = $("ecats").getElementsByTagName("button"), gb = $("egrid").getElementsByTagName("button"), j;
    for (j = 0; j < cb.length; j++) { cb[j].addEventListener("click", function () { ecat = parseInt(this.getAttribute("data-g"), 10); $("esearch").value = ""; eRender(); }); }
    for (j = 0; j < gb.length; j++) { gb[j].addEventListener("click", function () { $("icon").value = this.getAttribute("data-c"); $("picker").hidden = true; preview(); }); }
  }
  $("pick").addEventListener("click", function () {
    $("picker").hidden = !$("picker").hidden;
    if ($("picker").hidden) { return; }
    if (EMOJI) { return eRender(); }
    api("emoji").then(function (d) { EMOJI = d; $("esrc").textContent = d.source; eRender(); }).catch(function (e) { say(e.message, "err"); });
  });
  $("noicon").addEventListener("click", function () { $("icon").value = ""; preview(); });
  $("esearch").addEventListener("input", eRender);
  // The language is a Shard setting (default English); it also decides the language of the app screen on the TV.
  function setLang(l) { lang = l; applyLang(); api("lang", { lang: l }).catch(function (e) { say(e.message, "err"); }); }
  // The dashboard frame has no allow-forms: use buttons and the Enter key, not <form>.
  $("send").addEventListener("click", function () {
    say(tr("sending"));
    act(this, api("notify", { title: $("title").value, message: $("message").value, level: level, icon: $("icon").value, image: $("image").value, wallpaper: $("wallpaper").value, mode: mode, duration: parseInt($("secs").value, 10) || 8, open: $("open").checked })
      .then(function (r) { say(r.open === "not requested" ? tr("queuedq") : tr("queued"), "ok"); $("message").value = ""; preview(); recent().catch(function () {}); })
      .catch(function (e) { say(e.message, "err"); throw e; }));
  });
  $("message").addEventListener("keydown", function (e) { if (e.key === "Enter") { $("send").click(); } });
  $("message").addEventListener("input", preview); $("icon").addEventListener("input", preview); $("title").addEventListener("input", preview);
  $("secs").addEventListener("input", function () { $("secsv").textContent = this.value + " s"; preview(); });
  $("refresh").addEventListener("click", function () { act(this, recent()); });
  $("l-en").addEventListener("click", function () { setLang("en"); });
  $("l-pt").addEventListener("click", function () { setLang("pt"); });
  $("curl").textContent = 'curl -X POST http://<TV-IP>:8099/plugins/notification-center/api/notify \\\n  -H "Content-Type: application/json" \\\n  -d \'{"title":"Oven","message":"Dinner is ready","level":"ok","seconds":30}\'';
  applyLang();
  api("lang").then(function (d) { if (T[d.lang] && d.lang !== lang) { lang = d.lang; applyLang(); } }).catch(function () { /* keep English */ });
})();
</script>
</body>
