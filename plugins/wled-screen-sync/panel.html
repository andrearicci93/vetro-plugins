<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ambilight Studio</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#101017;color:#f5f2fb}
*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:auto;padding:clamp(18px,4vw,42px)}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.header{position:sticky;top:0;z-index:30;background:#101017;padding:12px 0}.header-actions{display:flex;align-items:center;gap:10px}.view-switch{display:flex;align-items:center;gap:7px}.view-switch select{min-width:105px}
h1{font-size:clamp(32px,5vw,54px);letter-spacing:-.055em;margin:0}h2{font-size:1.05rem;margin:0 0 10px}
section,details{background:#1a1924;border:1px solid #383443;border-radius:16px;padding:20px;margin:14px 0}
.capture{background:linear-gradient(125deg,#29203c,#1c1c2b);padding:24px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:12px;margin:20px 0}.metrics strong{font:600 1.35rem system-ui;display:block}.audio-bars{display:flex;gap:4px;height:5px;margin-top:7px}.audio-bars i{display:block;width:0;background:linear-gradient(90deg,#bb9aff,#63d9d0);border-radius:4px;transition:width .12s linear}.audio-bars div{height:5px;flex:1;background:#383443;border-radius:4px;overflow:hidden}.audio-bars i{height:100%}
canvas{width:100%;height:38px;background:#100f17;border-radius:8px;display:block;margin:10px 0}
.row{display:grid;grid-template-columns:minmax(140px,1fr) minmax(170px,1fr);gap:12px 26px;align-items:center;padding:14px 0}.row+.row{border-top:1px solid #35303f}
label,summary{font-weight:600}summary{cursor:pointer}small,.unit,#status{color:#c0b7cf;line-height:1.45}small{display:block;margin-top:4px}
.inputs,.actions,footer,nav{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
input,select,button{background:#211f2c;color:inherit;border:1px solid #524861;border-radius:8px;padding:9px;font:inherit}
input[type=range]{min-width:50px;flex:1;accent-color:#bc9aff}input[type=number]{width:5em}select{max-width:100%}button{cursor:pointer}
button.primary,nav button[aria-pressed=true]{background:#d5bcff;color:#21132e;border-color:transparent;font-weight:650}
button:disabled{opacity:.5;cursor:default}footer{position:sticky;bottom:0;background:#101017f5;padding:14px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:620px){.row{grid-template-columns:1fr}section{padding:15px}.metrics strong{font-size:1.2rem}}
.row{padding:18px 0}.inputs:has(input[type=range]){display:grid;grid-template-columns:minmax(0,1fr) 5em auto;gap:10px}.inputs input[type=range]{width:100%;min-width:0;padding:0;margin:0;border:0}.inputs input[type=number]{width:100%}nav{margin:16px 0;gap:10px}footer{margin-top:18px}#view{margin:8px 12px}input[type=checkbox]{width:22px;height:22px;accent-color:#bc9aff}
.mode-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.mode-card{border:1px solid #454052;border-radius:12px;padding:12px;background:#211f2c;cursor:pointer}.mode-card strong,.mode-card small{display:block}.mode-card small{margin-top:5px}.mode-card.selected{border-color:#bc9aff;background:#33264a}.mode-card.selected strong{color:#e7d8ff}@media(max-width:620px){.mode-cards{grid-template-columns:1fr 1fr}}
.row[hidden]{display:none!important}</style>
<main><header class="header"><h1>Ambilight Studio</h1><div class="header-actions"><p id="status" role="status">Connecting…</p><label class="view-switch">View <select id="view"><option value="simple">Simple</option><option value="advanced">Advanced</option></select></label></div></header>
<section class="capture"><h2>Strip output</h2><canvas id="strip" width="768" height="38" aria-label="48 color samples in physical strip order"></canvas>
<small id="previewState">Waiting for output…</small>
<div class="metrics"><div><small>Active zones</small><strong id="zones">—</strong></div><div><small>Scans / sec</small><strong id="fps">—</strong></div><div><small>Changes / sec</small><strong id="changes">—</strong></div><div><small>Audio level</small><strong id="audioLevel">—</strong></div><div><small>Bass / mid / treble</small><strong id="audioBands">—</strong><div class="audio-bars"><div><i id="bassBar"></i></div><div><i id="midBar"></i></div><div><i id="trebleBar"></i></div></div></div><div><small>Audio received</small><strong id="audioBytes">—</strong></div></div>
<div class="actions"><button type="button" data-action="start">Start</button><button type="button" data-action="stop">Stop</button><button type="button" data-action="restart">Restart capture</button><span id="captureMsg" role="status"></span></div></section>
<details id="diagnosticsPanel" hidden><summary>Capture diagnostics</summary><pre id="diagnostics">Waiting for capture…</pre></details>
<nav id="tabs" aria-label="Settings groups"></nav>
<form id="form"><div id="groups"></div>
<footer><button type="button" class="primary" id="apply" disabled>Apply settings</button><button type="button" id="defaults" disabled>Restore defaults</button><span role="status" id="msg"></span></footer></form></main>
<script>
'use strict';
var fields=[], saved={}, inputs={}, pending=false;
var el=function(id){return document.getElementById(id)};
function request(url,opts){return fetch(url,opts).then(function(r){return r.json().then(function(d){if(!r.ok)throw Error(d.error||'Request failed');return d;});});}
function node(tag,parent,txt){var n=document.createElement(tag);parent.appendChild(n);if(txt!==undefined)n.textContent=txt;return n;}
function values(){var d={};fields.forEach(function(f){if(f.key==='UiView')d[f.key]=el('view').value;else d[f.key]=f.type==='toggle'?inputs[f.key].main.checked:f.options||f.type==='color'||f.type==='ipv4'?inputs[f.key].main.value:Number(inputs[f.key].main.value);});return d;}
function change(){var v=values();setView(v);var dirty=fields.some(function(f){return saved[f.key]!==v[f.key];});el('apply').disabled=!dirty||pending;el('msg').textContent=dirty?'Unsaved changes':'';}
function fill(d){el('view').value=d.UiView||'simple';fields.forEach(function(f){if(f.key==='UiView'||!inputs[f.key]||!inputs[f.key].main)return;var i=inputs[f.key];if(f.type==='toggle')i.main.checked=d[f.key];else i.main.value=d[f.key];if(i.range)i.range.value=d[f.key];if(i.cards)i.cards.querySelectorAll('.mode-card').forEach(function(c){c.classList.toggle('selected',c.dataset.value===d[f.key]);});});change();setView();}
var activeGroup='Lighting';
function applies(f,v){
 var picture=v.Lighting!=='tv-audio', combined=v.Lighting==='screen-audio';
 if(f.group==='TV audio'){
  if(v.Lighting==='screen')return false;
  if(f.key==='AudioBlend')return combined;
  var effects={ImpactEffect:'impact',BalancedEffect:'balanced',MusicEffect:'music',AudioReaction:'custom'};
  var pictureEffect=f.key.indexOf('Picture')===0;
  var profile=effects[pictureEffect?f.key.slice(7):f.key];
  if(profile)return pictureEffect===combined&&profile===v.AudioSampling;
  if(['AudioSensitivity','AudioResponse','CustomDetector','CustomThreshold'].indexOf(f.key)>=0)return v.AudioSampling==='custom';
  return true;
 }
 if(f.group==='Sampling'&&!picture)return false;
 if(['Hdr','Reference','ZonesMode','Zones','Depth','CaptureHz','CaptureResolution'].indexOf(f.key)>=0){
  if(!picture||v.Source==='sampler')return false;
  if(f.key==='Reference')return v.Hdr!=='off';
  if(f.key==='Zones')return v.ZonesMode==='custom';
 }
 return picture||['Smooth','Saturation','ImmediatePicture'].indexOf(f.key)<0;
}
function setView(v){
 v=v||values();
 var simple=v.UiView==='simple',available={};
 var basic=['Lighting','Wled','Brightness','Smooth','PictureImpactEffect','PictureBalancedEffect','PictureMusicEffect','PictureAudioReaction','ImpactEffect','BalancedEffect','MusicEffect','CustomDetector','CustomThreshold','AudioReaction','AudioSensitivity','AudioBlend','AudioSampling','AudioResponse'];
 el('diagnosticsPanel').hidden=simple;
 el('tabs').style.display=simple?'none':'';
 fields.forEach(function(f){
  if(!inputs[f.key])return;
  var visible=applies(f,v)&&(!simple||basic.indexOf(f.key)>=0);
  inputs[f.key].main.closest('.row').hidden=!visible;
  if(visible)available[f.group]=true;
 });
 if(!available[activeGroup])activeGroup='Lighting';
 Array.prototype.forEach.call(el('groups').children,function(section,i){
  var group=section.querySelector('h2').textContent,tab=el('tabs').children[i];
  section.hidden=!available[group]||(!simple&&activeGroup!==group);
  tab.style.display=available[group]?'':'none';
  tab.setAttribute('aria-pressed',String(activeGroup===group));
 });
}
function draw(data){
 fields=data.fields.filter(function(f){return !f.hidden;});saved=data.values;var sections={};
 fields.forEach(function(f){
  if(f.key==='UiView')return;
  var section=sections[f.group];if(!section){section=node('section',el('groups'));sections[f.group]=section;node('h2',section,f.group);
   var tab=node('button',el('tabs'),f.group);
   section.hidden=Object.keys(sections).length>1;
   tab.setAttribute('aria-pressed',String(!section.hidden));
   tab.onclick=function(){
    activeGroup=f.group;setView();
   };}
  var row=node('div',section);row.className='row';var left=node('div',row),label=node('label',left,f.label);label.htmlFor=f.key;
  if(f.hint)node('small',left,f.hint);
  if(f.key==='CaptureResolution'){var resolution=node('small',left);resolution.id='resolutionStatus';}
  var right=node('div',row);right.className='inputs';var i={};inputs[f.key]=i;
  if(f.type==='count'){i.main=node('input',right);i.main.type='number';i.main.min=f.min;i.main.max=f.max;i.main.required=true;}
  else if(f.type==='toggle'){i.main=node('input',right);i.main.type='checkbox';}
  else if(f.type==='color'){i.main=node('input',right);i.main.type='color';}
  else if(f.type==='ipv4'){i.main=node('input',right);i.main.type='text';i.main.inputMode='decimal';i.main.autocomplete='off';i.main.pattern='(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])(?:\\.(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])){3}';i.main.required=true;}
  else if(f.options||f.choices){
   if(f.key==='Lighting'){
    i.main=node('select',right);i.main.style.display='none';
    var cards=node('div',right);cards.className='mode-cards';i.cards=cards;
    (f.choices||Object.keys(f.options)).forEach(function(k){
     var o=node('option',i.main,f.options?f.options[k]:k);o.value=k;
     var card=node('button',cards);card.type='button';card.className='mode-card';card.dataset.value=k;
     node('strong',card,f.options[k]);node('small',card,k==='screen'?'Picture colors':k==='screen-audio'?'Picture + live audio':'Live TV audio');
     card.onclick=function(){i.main.value=k;change();cards.querySelectorAll('.mode-card').forEach(function(c){c.classList.toggle('selected',c.dataset.value===k);});};
    });
    cards.querySelectorAll('.mode-card').forEach(function(c){c.classList.toggle('selected',c.dataset.value===saved.Lighting);});
   } else {
    i.main=node('select',right);(f.choices||Object.keys(f.options)).forEach(function(k){var o=node('option',i.main,f.options?f.options[k]:k);o.value=k;});
   }
  }
  else{i.range=node('input',right);i.range.type='range';i.range.setAttribute('aria-label',f.label);i.main=node('input',right);i.main.type='number';i.main.required=true;
   [i.range,i.main].forEach(function(n){n.min=f.min;n.max=f.max;n.step=1;});i.range.oninput=function(){i.main.value=i.range.value;change();};
   node('span',right,f.unit).className='unit';
  }
  i.main.id=f.key;
  if(f.key==='Wled'){
   addDiscovery(right,i.main);
   i.main.oninput=i.main.onchange=change;
  } else {
   i.main.oninput=i.main.onchange=function(){if(i.range)i.range.value=i.main.value;change();};
  }
 });
 el('view').onchange=function(){change();};
 el('view').value=saved.UiView||'simple';
 setView();fill(saved);el('defaults').disabled=false;
}
function addDiscovery(parent,input){
 var search=node('button',parent,'Find WLED controllers'), results=node('div',parent);
 search.type='button'; results.setAttribute('aria-live','polite');
 function connect(device){
  if(pending)return;
  var before=saved,draft=values();
  pending=true;input.value=device.address;search.disabled=true;
  el('groups').style.pointerEvents='none';el('defaults').disabled=true;change();
  results.textContent='Connecting to '+device.address+'…';
  request('wled-probe',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({address:device.address})}).then(function(){
   return request('settings',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({Wled:device.address})});
  }).then(function(data){
   saved=data.values;
   var next={};fields.forEach(function(f){
    var layout=/^(Top|Right|Bottom|Left)Count$/.test(f.key);
    next[f.key]=f.key!=='Wled'&&!(layout&&before.Wled!==saved.Wled)&&draft[f.key]!==before[f.key]?draft[f.key]:saved[f.key];
   });
   fill(next);results.textContent='Connected to '+device.name+' · '+saved.Wled;
  }).catch(function(e){input.value=before.Wled;results.textContent=e.message;}).then(function(){
   pending=false;search.disabled=false;el('groups').style.pointerEvents='';el('defaults').disabled=false;change();
  });
 }
 search.onclick=function(){
  search.disabled=true;results.textContent='Searching the local network…';
  request('discover',{method:'POST'}).then(function(data){
   results.textContent=data.devices.length?'':'No controllers advertised. Enter an IPv4 address manually.';
   data.devices.forEach(function(device){
    var pick=node('button',results,device.name+' · '+device.address);pick.type='button';
    pick.onclick=function(){connect(device);};
   });
  }).catch(function(error){results.textContent=error.message;}).then(function(){search.disabled=false;});
 };
}
el('defaults').onclick=function(){var d={};fields.forEach(function(f){d[f.key]=f.group==='WLED target'||f.group==='Strip sides'?saved[f.key]:f.default;});fill(d);};
el('apply').onclick=function(){if(pending||!el('form').reportValidity())return;var v=values(),patch={};fields.forEach(function(f){if(v[f.key]!==saved[f.key])patch[f.key]=v[f.key];});
 pending=true;el('apply').disabled=true;el('groups').style.pointerEvents='none';el('defaults').disabled=true;
 request('settings',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(patch)}).then(function(d){pending=false;saved=d.values;fill(saved);el('msg').textContent='Settings saved';}).catch(function(e){pending=false;change();el('msg').textContent=e.message;}).then(function(){el('groups').style.pointerEvents='';el('defaults').disabled=false;});};
document.querySelectorAll('[data-action]').forEach(function(button){button.onclick=function(){
 var action=button.dataset.action;document.querySelectorAll('[data-action]').forEach(function(b){b.disabled=true;});
 el('captureMsg').textContent=action==='stop'?'Stopping…':action==='start'?'Starting…':'Restarting…';
 request('capture-action',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:action})})
 .then(function(result){
  if(!result.ok)throw Error('Capture action did not complete. Check Live diagnostics.');
  if(action==='restart'){el('captureMsg').textContent='Capture restarted';return;}
  el('captureMsg').textContent=action==='stop'?'Capture stopped':'Capture starting';
 }).then(function(){setTimeout(live,1200);})
 .catch(function(e){el('captureMsg').textContent=e.message;})
 .then(function(){setTimeout(function(){document.querySelectorAll('[data-action]').forEach(function(b){b.disabled=false;});},1200);});
};});
function metric(text,pattern,id){var match=text.match(pattern);el(id).textContent=match?match[1]:'—';}
function showResolution(text){
 var status=el('resolutionStatus');if(!status)return;
 var nativeSize=text.match(/(\d+x\d+) video plane/),grid=text.match(/sampling grid (\d+x\d+)/);
 status.textContent=nativeSize&&grid?'Live TV frame '+nativeSize[1]+' · LED sampling grid '+grid[1]:'Waiting for full-picture capture…';
}
function live(){
 request('live').then(function(data){
  var text=data.stdout||'';
  showResolution(text);
  el('diagnostics').textContent=text||'Waiting for capture…';
  metric(text,/(\d+) regions/,'zones');metric(text,/capture ([\d.]+)\/s/,'fps');metric(text,/changed ([\d.]+)\/s/,'changes');
  var audio=text.match(/audio level (\d+)/)||text.match(/audio rms (\d+)/)||text.match(/audio (\d+)/);
  if(audio)el('audioLevel').textContent=audio[1]+'/255';
  else if(saved.Lighting==='tv-audio'||saved.Lighting==='screen-audio')el('audioLevel').textContent='Listening';
  else el('audioLevel').textContent='—';
  var bands=text.match(/audio bands (\d+)\/(\d+)\/(\d+)/);
  el('audioBands').textContent=bands?bands[1]+' / '+bands[2]+' / '+bands[3]:'—';
  if(bands){el('bassBar').style.width=Math.min(100,Number(bands[1])/2.55)+'%';el('midBar').style.width=Math.min(100,Number(bands[2])/2.55)+'%';el('trebleBar').style.width=Math.min(100,Number(bands[3])/2.55)+'%';}
  else{el('bassBar').style.width='0%';el('midBar').style.width='0%';el('trebleBar').style.width='0%';}
  var bytes=text.match(/audio bytes (\d+)/);
  if(bytes){var mb=Number(bytes[1])/1048576;el('audioBytes').textContent=(mb<1?'<1':mb.toFixed(1))+' MB';}
  else el('audioBytes').textContent='—';
  var samplerFailure=text.match(/TV color sampler (?:failed|unavailable): [^,]+/);
  el('status').textContent=data.state==='failed'?(text||'Capture failed. Press Start to retry.'):
   samplerFailure?samplerFailure[0]+' · output suspended':
   saved.Lighting==='tv-audio'?'TV audio sync':saved.Lighting==='screen-audio'?'Screen + TV audio':saved.Lighting==='screen'?(text.indexOf('TV sampled RGB')>=0?'TV color sampler':text.indexOf('HDR10 PQ')>=0?'Full picture · HDR':text.indexOf('SDR BT.709')>=0?'Full picture · SDR':'Screen sync'):'Effect active';
 }).catch(function(){showResolution('');el('status').textContent='Capture status unavailable';});
}
function preview(){
 var canvas=el('strip'),ctx=canvas.getContext('2d');
 request('preview').then(function(data){
  ctx.clearRect(0,0,768,38);
  var rgb=atob(data.rgb||'');
  if(rgb.length!==144){el('previewState').textContent='No recent picture output';return;}
  for(var i=0;i<48;i++){
   ctx.fillStyle='rgb('+rgb.charCodeAt(3*i)+','+rgb.charCodeAt(3*i+1)+','+rgb.charCodeAt(3*i+2)+')';
   ctx.fillRect(i*16,0,16,38);
  }
  el('previewState').textContent='First LED → last LED · refreshed every second';
 }).catch(function(){ctx.clearRect(0,0,768,38);el('previewState').textContent='Preview unavailable';}).then(function(){setTimeout(preview,1000);});
}
preview();
request('settings').then(draw).catch(function(e){el('msg').textContent=e.message;});live();setInterval(live,5000);
</script></html>
