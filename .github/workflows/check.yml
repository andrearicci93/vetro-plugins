name: Check Shards
on:
  pull_request:
  push:
    branches-ignore: [main, catalog]
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 20, cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - if: github.event_name == 'pull_request'
        env:
          BASE_REF: refs/remotes/origin/${{ github.base_ref }}
        run: node scripts/check-changes.cjs "$BASE_REF"
  runtime:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ['4.4.7', '12.4.0', '20']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      # No signing secret, write token, or real TV commands in these jobs.
      - run: node scripts/test-runtime.cjs
  # Binaries in helpers/ (too big for a bundle) must rebuild byte for byte from their source in the repo.
  helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: 1.26.0, cache: false}
      - run: go version
      - working-directory: plugins/vpn/nordtv
        run: go test ./...
      - run: sh scripts/check-helpers.sh
  guide-helper:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 20}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: {dotnet-version: 8.0.100}
      # SDK 8.0.100: compare rebuilt/embedded DLL SHA-256 and test state-file safety.
      # No TV access or signing secret is available to this job.
      - run: node scripts/build-eightbitdo-guide-helper.cjs --check
  wled-helper:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 20}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: {dotnet-version: 8.0.100}
      - run: node scripts/build-wled-screen-sync-helper.cjs --check
      - run: dotnet run --project ../../tests/wled-helper/Checks.csproj --configuration Release
        working-directory: helpers/wled-screen-sync
  check:
    if: always()
    needs: [validate, runtime, helpers, guide-helper, wled-helper]
    runs-on: ubuntu-latest
    steps:
      - env:
          VALIDATION: ${{ needs.validate.result }}
          RUNTIME: ${{ needs.runtime.result }}
          HELPERS: ${{ needs.helpers.result }}
          GUIDE_HELPER: ${{ needs.guide-helper.result }}
          WLED_HELPER: ${{ needs.wled-helper.result }}
        run: >-
          test "$VALIDATION" = success &&
          test "$RUNTIME" = success &&
          test "$HELPERS" = success &&
          test "$GUIDE_HELPER" = success &&
          test "$WLED_HELPER" = success